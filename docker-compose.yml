services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentbridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/talentbridge?schema=public
      JWT_SECRET: local-compose-only-change-me
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - backend_uploads:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
  backend_uploads:
